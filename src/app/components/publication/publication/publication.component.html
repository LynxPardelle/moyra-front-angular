<article class="publication-detail bef bef-wmx-980px mx-auto px-3 py-4">
  <div
    class="position-fixed bef bef-top-15per top-md-10per end-0 admin-actions"
    *ngIf="
      identity &&
      identity.role === 'ROLE_ADMIN' &&
      canChange === true &&
      isAdmin === true
    "
  >
    <button
      *ngIf="editSwitch === false"
      class="btn bef bef-btn-linkM bef-text-bg1M mr-2"
      type="button"
      (click)="switchEdit()"
      title="Editar publicación"
    >
      Editar
    </button>

    <button
      *ngIf="editSwitch === true"
      class="btn bef bef-btn-linkM bef-text-bg1M mr-2"
      type="button"
      (click)="switchEdit()"
      title="Cerrar edición"
    >
      X
    </button>

    <button
      *ngIf="publicationRecordId(publication)"
      class="btn btn-warning mr-2"
      type="button"
      (click)="deletePublication(publicationRecordId(publication))"
      title="Borrar publicación"
    >
      Borrar
    </button>
  </div>

  <div *ngIf="loading" class="text-center my-5">Cargando publicación...</div>

  <ng-container *ngIf="!loading && editSwitch === false">
    <a
      class="d-inline-block mb-3 text-decoration-none bef bef-text-linkM"
      href="/publications"
      [routerLink]="[isAdmin ? '/admin/publications' : '/publications']"
    >
      Volver a publicaciones
    </a>

    <header class="publication-detail__header text-center mx-auto mb-4">
      <h2 class="mb-3" *ngIf="publication.title">{{ publication.title }}</h2>
    </header>

    <img
      *ngIf="
        publication.mainFile &&
        fileUrl(publication.mainFile) &&
        isImage(publication.mainFile)
      "
      class="publication-detail__hero mx-auto mb-4"
      [src]="fileUrl(publication.mainFile)"
      [alt]="publication.mainFile.title || publication.title"
    />

    <div
      *ngIf="publication.text"
      class="publication-detail__content mx-auto my-4"
      [innerHTML]="
        Linkify(valuefy(publication.text), '#29303b', '#4b8ff5') | safeHtml
      "
    ></div>

    <p *ngIf="publication.youtube" class="text-center my-4">
      <a
        class="btn bef bef-btn-linkM bef-text-bg1M"
        [href]="publication.youtube"
        target="_blank"
        rel="noopener"
      >
        Ver video relacionado
      </a>
    </p>

    <section
      *ngIf="publication.files && publication.files.length > 0"
      class="publication-files mx-auto mt-5"
    >
      <h3 class="h5 text-center mb-3">Archivos relacionados</h3>
      <div class="publication-files__grid">
        <a
          *ngFor="let file of publication.files"
          class="publication-file text-decoration-none"
          [href]="fileUrl(file)"
          target="_blank"
          rel="noopener"
        >
          <img
            *ngIf="isImage(file)"
            class="publication-file__image"
            [src]="fileUrl(file)"
            [alt]="file.title || publication.title"
          />
          <span class="publication-file__title">
            {{ file.title || file.location || 'Archivo' }}
          </span>
        </a>
      </div>
    </section>
  </ng-container>

  <section *ngIf="!loading && editSwitch === true" class="publication-editor mx-auto">
    <h2 class="h3 text-center mb-4">
      {{ publicationRecordId(publication) ? 'Editar publicación' : 'Crear publicación' }}
    </h2>

    <div class="d-block w-100 mx-auto my-3">
      <label class="bef bef-text-textM mb-1 d-block" for="title">Título</label>
      <input
        class="w-100 bef bef-text-bg1M bef-bg-textM border-0 publication-input"
        type="text"
        id="title"
        name="title"
        [(ngModel)]="publication.title"
        placeholder="Título de la publicación"
        required
      />
    </div>

    <div class="d-block w-100 mx-auto my-3">
      <label class="bef bef-text-textM mb-1 d-block" for="urltitle">
        link-de-la-publicacion-sin-acentos-ni-espacios
      </label>
      <input
        class="w-100 bef bef-text-bg1M bef-bg-textM border-0 publication-input"
        type="text"
        id="urltitle"
        name="urltitle"
        [(ngModel)]="publication.urltitle"
        placeholder="link-de-la-publicacion"
      />
    </div>

    <div class="d-block w-100 mx-auto my-3">
      <label class="bef bef-text-textM mb-1 d-block" for="text">Contenido</label>
      <textarea
        class="w-100 bef bef-text-bg1M bef-bg-textM border-0 publication-textarea"
        id="text"
        name="text"
        [(ngModel)]="publication.text"
        placeholder="Contenido de la publicación"
        required
      ></textarea>
    </div>

    <div class="d-block w-100 mx-auto my-3">
      <label class="bef bef-text-textM mb-1 d-block" for="youtube">
        Video relacionado
      </label>
      <input
        class="w-100 bef bef-text-bg1M bef-bg-textM border-0 publication-input"
        type="url"
        id="youtube"
        name="youtube"
        [(ngModel)]="publication.youtube"
        placeholder="https://..."
      />
    </div>

    <div class="d-block w-100 mx-auto my-3">
      <label class="bef bef-text-textM mb-1 d-block" for="insertions">
        Inserciones
      </label>
      <textarea
        class="w-100 bef bef-text-bg1M bef-bg-textM border-0 publication-small-textarea"
        id="insertions"
        name="insertions"
        [ngModel]="insertionLines()"
        (ngModelChange)="updateInsertions($event)"
        placeholder="Una inserción por línea"
      ></textarea>
    </div>

    <button
      class="btn bef bef-btn-linkM bef-text-bg1M mx-auto d-block my-4 w-100"
      type="button"
      (click)="onSubmit()"
    >
      {{ publicationRecordId(publication) ? 'Guardar publicación' : 'Crear publicación' }}
    </button>

    <section *ngIf="publicationRecordId(publication)" class="publication-upload mt-5">
      <h3 class="h5 text-center mb-3">Imagen principal</h3>
      <img
        *ngIf="
          publication.mainFile &&
          fileUrl(publication.mainFile) &&
          isImage(publication.mainFile)
        "
        class="publication-upload__preview mx-auto mb-3"
        [src]="fileUrl(publication.mainFile)"
        [alt]="publication.mainFile.title || publication.title"
      />
      <app-file-uploader
        [type]="'publication'"
        [typeMeta]="'one'"
        [typeThingComRes]="'publication'"
        [thing]="publication"
        [thingInside]="false"
        [id]="publicationRecordId(publication)"
        (pre_loader)="pre_load()"
        (recoverThing)="recoverThingFather()"
      ></app-file-uploader>

      <hr class="my-5" />

      <h3 class="h5 text-center mb-3">Archivos relacionados</h3>
      <app-file-uploader
        [type]="'publication'"
        [typeMeta]="'multi'"
        [typeThingComRes]="'publication'"
        [thing]="publication"
        [thingInside]="false"
        [id]="publicationRecordId(publication)"
        (pre_loader)="pre_load()"
        (recoverThing)="recoverThingFather()"
      ></app-file-uploader>
    </section>
  </section>
</article>
