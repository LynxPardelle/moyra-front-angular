@if (embed?.kind === 'youtube') {
<iframe
  class="safe-embed-frame"
  [class.safe-embed-frame--compact]="compact"
  [src]="embed?.embedUrl | safeEmbedUrl"
  [title]="embed?.title || 'Video relacionado'"
  allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share; fullscreen"
  loading="lazy"
  referrerpolicy="strict-origin-when-cross-origin"
></iframe>
} @if (embed?.kind === 'iframe') {
<iframe
  class="safe-embed-frame safe-embed-frame--external"
  [class.safe-embed-frame--compact]="compact"
  [src]="embed?.embedUrl | safeEmbedUrl"
  [title]="embed?.title || 'Inserción relacionada'"
  [attr.allow]="embed?.allow || defaultExternalAllow"
  [attr.sandbox]="embed?.sandbox || defaultExternalSandbox"
  loading="lazy"
  referrerpolicy="strict-origin-when-cross-origin"
  [style.height.px]="embed?.height"
></iframe>
} @if (embed?.kind === 'link') {
<a
  class="safe-embed-link"
  [class.safe-embed-link--compact]="compact"
  [href]="embed?.url"
  target="_blank"
  rel="noopener noreferrer"
>
  <span>{{ embed?.title }}</span>
  <small>{{ embed?.url }}</small>
</a>
}
