<section class="account-page">
  <div class="account-panel">
    <p class="account-panel__eyebrow">Cuenta</p>
    <h1 class="account-panel__title">Cambiar contraseña</h1>

    <form class="account-form" (ngSubmit)="submitPasswordChange()">
      <div class="account-field">
        <label class="account-field__label" for="current-password"> Contraseña actual </label>
        <input
          id="current-password"
          class="account-field__control"
          type="password"
          name="currentPassword"
          [(ngModel)]="passwordChange.currentPassword"
          autocomplete="current-password"
          required
        />
      </div>

      <div class="account-field">
        <label class="account-field__label" for="new-password"> Nueva contraseña </label>
        <input
          id="new-password"
          class="account-field__control"
          type="password"
          name="newPassword"
          [(ngModel)]="passwordChange.newPassword"
          autocomplete="new-password"
          required
        />
      </div>

      <div class="account-field">
        <label class="account-field__label" for="confirm-password"> Confirmar contraseña </label>
        <input
          id="confirm-password"
          class="account-field__control"
          type="password"
          name="confirmPassword"
          [(ngModel)]="passwordChange.confirmPassword"
          autocomplete="new-password"
          required
        />
      </div>

      @if (message) {
      <p class="account-form__message">
        {{ message }}
      </p>
      } @if (error) {
      <p class="account-form__error">
        {{ error }}
      </p>
      }

      <button class="account-button" type="submit" [disabled]="pending">
        Actualizar contraseña
      </button>
      <a class="account-link" href="/" [routerLink]="['/']">Volver al sitio</a>
    </form>
  </div>
</section>
