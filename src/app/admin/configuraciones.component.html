<section class="admin-config-page">
  <header class="admin-config-page__header">
    <p>Administración</p>
    <h1>Configuraciones</h1>
    <span>Textos generales de páginas públicas.</span>
  </header>

  <div *ngIf="loading" class="admin-config-card">Cargando configuraciones...</div>

  <form *ngIf="!loading" class="admin-config-form" (ngSubmit)="save()">
    <section *ngFor="let group of groupedFields" class="admin-config-card">
      <div class="admin-config-card__heading">
        <h2>{{ group.section }}</h2>
        <p *ngIf="group.description">{{ group.description }}</p>
      </div>

      <label *ngFor="let field of group.fields" class="admin-config-field">
        <span class="admin-config-field__label">{{ field.label }}</span>
        <small>{{ field.description }}</small>
        <textarea
          *ngIf="field.multiline; else inputField"
          [(ngModel)]="pageTexts[field.key]"
          [name]="field.key"
          [placeholder]="field.defaultValue"
          rows="4"
        ></textarea>

        <ng-template #inputField>
          <input
            [(ngModel)]="pageTexts[field.key]"
            [name]="field.key"
            [placeholder]="field.defaultValue"
            type="text"
          />
        </ng-template>
      </label>
    </section>

    <button class="admin-config-save" type="submit" [disabled]="saving">
      {{ saving ? 'Guardando...' : 'Guardar configuraciones' }}
    </button>
  </form>
</section>
