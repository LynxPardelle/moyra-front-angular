<section class="admin-users-page">
  <header class="admin-users-page__header">
    <p>Usuarios</p>
    <h1>Crear usuario</h1>
    <span>
      Alta administrada para cuentas de Moyra. El usuario recibirá una contraseña temporal y deberá
      cambiarla en su primer inicio de sesión.
    </span>
  </header>

  <form class="admin-users-form" (ngSubmit)="createUser()" #userForm="ngForm">
    <label class="admin-users-field">
      <span>Nombre</span>
      <input type="text" name="name" [(ngModel)]="user.name" autocomplete="name" required />
    </label>

    <label class="admin-users-field">
      <span>Correo electrónico</span>
      <input type="email" name="email" [(ngModel)]="user.email" autocomplete="email" required />
    </label>

    <label class="admin-users-field">
      <span>Rol</span>
      <select name="role" [(ngModel)]="user.role" required>
        <option value="ROLE_USER">Usuario</option>
        <option value="ROLE_ADMIN">Administrador</option>
      </select>
    </label>

    <label class="admin-users-field">
      <span>Contraseña temporal</span>
      <input
        type="password"
        name="temporaryPassword"
        [(ngModel)]="user.temporaryPassword"
        autocomplete="new-password"
        required
      />
      <small [class.admin-users-field__error]="user.temporaryPassword && !passwordMeetsPolicy()">
        Mínimo 10 caracteres, una mayúscula, una minúscula y un número.
      </small>
    </label>

    <label class="admin-users-field">
      <span>Confirmar contraseña temporal</span>
      <input
        type="password"
        name="confirmTemporaryPassword"
        [(ngModel)]="user.confirmTemporaryPassword"
        autocomplete="new-password"
        required
      />
      @if (user.confirmTemporaryPassword && !passwordsMatch()) {
      <small class="admin-users-field__error"> Las contraseñas no coinciden. </small>
      }
    </label>

    <button class="admin-users-save" type="submit" [disabled]="!canSubmit()">
      {{ saving ? 'Creando usuario...' : 'Crear usuario' }}
    </button>
  </form>
</section>
